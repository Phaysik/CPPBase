name: 'CI toolchain image'

# Reusable workflow: returns a CI toolchain image reference keyed by the content
# hash of .github/docker/ci.
# - Trusted runs (pushes, schedules, same-repo PRs) build and publish the image
#   to GHCR when it does not exist yet.
# - Fork PRs never publish. They reuse the image for their hash if it was already
#   published; otherwise they validate the Dockerfile with a non-pushing build and
#   fall back to the prepublished image of the PR's base commit.
on:
  workflow_call:
    outputs:
      image:
        description: 'Fully qualified CI toolchain image reference'
        value: ${{ jobs.image.outputs.image || jobs.image-fork.outputs.image }}

jobs:
  image:
    name: CI toolchain image
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute image tag
        id: meta
        run: echo "image=ghcr.io/phaysik/pocketcore-ci:${{ hashFiles('.github/docker/ci/**') }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing image
        id: exists
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .github/docker/ci
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image

  image-fork:
    name: CI toolchain image (fork, read-only)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.select.outputs.image }}

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout base Docker context
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          sparse-checkout: .github/docker/ci
          persist-credentials: false

      # hashFiles only hashes file contents, so the .base/ prefix yields the same tag the base commit published.
      - name: Compute image tags
        id: meta
        run: |
          echo "head=ghcr.io/phaysik/pocketcore-ci:${{ hashFiles('.github/docker/ci/**') }}" >> "$GITHUB_OUTPUT"
          echo "base=ghcr.io/phaysik/pocketcore-ci:${{ hashFiles('.base/.github/docker/ci/**') }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (read-only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select prepublished image
        id: select
        env:
          HEAD_IMAGE: ${{ steps.meta.outputs.head }}
          BASE_IMAGE: ${{ steps.meta.outputs.base }}
        run: |
          if docker manifest inspect "$HEAD_IMAGE" > /dev/null 2>&1; then
            echo "image=$HEAD_IMAGE" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$BASE_IMAGE" > /dev/null 2>&1; then
            echo "::warning::Fork changes .github/docker/ci; tests run on the base image $BASE_IMAGE. The new image is published after merge."
            echo "image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No prepublished CI image found for $HEAD_IMAGE or $BASE_IMAGE. A maintainer must publish the base image from a trusted run."
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.select.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Validate image build (no push)
        if: steps.select.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .github/docker/ci
          push: false
          tags: ${{ steps.meta.outputs.head }}
          cache-from: type=gha,scope=ci-image
