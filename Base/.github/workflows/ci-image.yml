name: 'CI toolchain image'

# Reusable workflow: builds and pushes .github/docker/ci only when no image with
# the current content hash exists in GHCR, then returns the image reference.
on:
  workflow_call:
    outputs:
      image:
        description: 'Fully qualified CI toolchain image reference'
        value: ${{ jobs.image.outputs.image }}

jobs:
  image:
    name: CI toolchain image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute image tag
        id: meta
        run: echo "image=ghcr.io/phaysik/pocketcore-ci:${{ hashFiles('.github/docker/ci/**') }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing image
        id: exists
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .github/docker/ci
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image
