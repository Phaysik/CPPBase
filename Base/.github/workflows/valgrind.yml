name: 'Run Valgrind Memory Leak Checker'

on:
  push:
    branches:
      - master
    paths:
      [
        '**.c',
        '**.cpp',
        '**.h',
        '**.hpp',
        '**.cxx',
        '**.hxx',
        '**.cc',
        '**.hh',
        'Makefile',
        '**CMakeLists.txt',
        'meson.build',
        '**.cmake',
        '**CMakePresets.json',
        '.github/workflows/valgrind.yml',
        '.github/workflows/ci-image.yml',
        '.github/docker/ci/**',
        'vcpkg.json',
      ]
  pull_request:
    branches:
      - master
    paths:
      [
        '**.c',
        '**.cpp',
        '**.h',
        '**.hpp',
        '**.cxx',
        '**.hxx',
        '**.cc',
        '**.hh',
        'Makefile',
        '**CMakeLists.txt',
        'meson.build',
        '**.cmake',
        '**CMakePresets.json',
        '.github/workflows/valgrind.yml',
        '.github/workflows/ci-image.yml',
        '.github/docker/ci/**',
        'vcpkg.json',
      ]

jobs:
  image:
    name: CI toolchain image
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  test:
    name: Valgrind
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.temp }}/vcpkg'

      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=${{ runner.temp }}/vcpkg" >> "$GITHUB_ENV"

      - name: Run Valgrind
        run: |
            cmake --preset gcc-valgrind
            cmake --build --preset valgrind
