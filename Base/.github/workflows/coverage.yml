name: 'Run coverage and upload to CodeCov'

on:
  push:
    branches:
      - master
    paths:
      [
        '**.c',
        '**.cpp',
        '**.h',
        '**.hpp',
        '**.cxx',
        '**.hxx',
        '**.cc',
        '**.hh',
        'Makefile',
        '**CMakeLists.txt',
        'meson.build',
        '**.cmake',
        '**CMakePresets.json',
        '.github/workflows/coverage.yml',
        'vcpkg.json',
      ]
  pull_request:
    branches:
      - master
    paths:
      [
        '**.c',
        '**.cpp',
        '**.h',
        '**.hpp',
        '**.cxx',
        '**.hxx',
        '**.cc',
        '**.hh',
        'Makefile',
        '**CMakeLists.txt',
        'meson.build',
        '**.cmake',
        '**CMakePresets.json',
        '.github/workflows/coverage.yml',
        'vcpkg.json',
      ]

jobs:
  test:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
      checks: write
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
            fetch-depth: 0

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.temp }}/vcpkg'

      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=${{ runner.temp }}/vcpkg" >> "$GITHUB_ENV"

      - name: Set up Cache Site
        run: mkdir -p ./cache

      - name: Set up Apt Cache Site
        run: |
          mkdir -p ./cache/apt-packages
          mkdir -p ./cache/apt-lists

      - name: Set up GCC Cache Site
        run: |
          mkdir -p ./cache/gcc-latest

      - name: Cache Apt Packages
        id: cache-apt-packages
        uses: actions/cache@v5
        with:
          path: ./cache/apt-packages
          key: ${{ runner.os }}-apt-packages-${{ hashFiles('makefileDependencies.sh') }}
          restore-keys: |
            ${{ runner.os }}-apt-packages-

      - name: Cache Apt Package Lists
        id: cache-apt-lists
        uses: actions/cache@v5
        with:
          path: ./cache/apt-lists
          key: ${{ runner.os }}-apt-lists-${{ hashFiles('makefileDependencies.sh') }}
          restore-keys: |
            ${{ runner.os }}-apt-lists-

      - name: Cache GCC
        id: cache-gcc-latest
        uses: actions/cache@v5
        with:
          path: |
            ./cache/gcc-latest
          key: ${{ runner.os }}-gcc-latest-${{ hashFiles('makefileDependencies.sh') }}
          restore-keys: |
            ${{ runner.os }}-gcc-latest-

      - name: Install Apt Packages From Cache
        if: steps.cache-apt-packages.outputs.cache-hit == 'true'
        run: sudo cp -r ./cache/apt-packages/apt/* /var/cache/apt

      - name: Install Apt Lists From Cache
        if: steps.cache-apt-lists.outputs.cache-hit == 'true'
        run: sudo cp -r ./cache/apt-lists/lists/* /var/lib/apt/lists

      - name: Install GCC From Cache
        if: steps.cache-gcc-latest.outputs.cache-hit == 'true'
        run: |
          sudo mkdir -p /usr/local/gcc-latest
          sudo cp -r ./cache/gcc-latest/* /usr/local/gcc-latest/
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/local/gcc-latest/bin/g++ 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/local/gcc-latest/bin/gcc 100
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/local/gcc-latest/bin/gcov 100

      - name: Install dependencies
        if: steps.cache-apt-packages.outputs.cache-hit != 'true' || steps.cache-apt-lists.outputs.cache-hit != 'true' || steps.cache-gcc-latest.outputs.cache-hit != 'true'
        run: sudo bash $GITHUB_WORKSPACE/makefileDependencies.sh a

      - name: Install Tooling Dependencies
        run: |
            wget -qO llvm.sh https://apt.llvm.org/llvm.sh
            sudo chmod +x llvm.sh
            sudo ./llvm.sh 24
            rm llvm.sh
            sudo apt update
            sudo apt-get install python3-pip libgmock-dev catch2 clang++-24 python3-sphinx build-essential libcapture-tiny-perl libdatetime-perl -y
            sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-24 24
            sudo update-alternatives --set clang++ /usr/bin/clang++-24
            pip3 install --upgrade pip --break-system-packages
            pip3 install cmake --break-system-packages
            sudo pip3 install sphinx-rtd-theme --break-system-packages
            curl -L -o lcov-latest.tar.gz https://github.com/linux-test-project/lcov/releases/download/v2.5/lcov-2.5.tar.gz
            mkdir -p lcov-latest
            tar -xvzf lcov-latest.tar.gz -C lcov-latest --strip-components=1
            sudo rm -rf lcov-latest.tar.gz
            cd lcov-latest
            sudo GIT_DIR=/dev/null make install
            cd ..
            sudo rm -rf lcov-latest

      - name: Build & run coverage
        run: |
            cmake --preset coverage
            cmake --build --preset coverage

      # Optional HMTL report for humans (won't fail the job)
      - name: Generate HTML report
        run: cmake --build --preset genhtml || true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage/coverage.info
          disable_search: true # only upload the curated coverage.info, don't scan the repo
          plugins: noop # don't run the gcov plugin, which would re-derive coverage (incl. tests/) from build artifacts
          flags: unittests
          name: gcc-coverage
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      # Upload artifacts (xml/info/html) so they survive the run
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
            name: coverage-report
            path: |
                build/coverage/coverage.info
                build/coverage/coverage/
            if-no-files-found: warn

      - name: Save Apt Packages Cache
        run: |
          sudo cp -r /var/cache/apt ./cache/apt-packages

      - name: Save Apt Lists Cache
        run: |
          sudo cp -r /var/lib/apt/lists ./cache/apt-lists

      - name: Find latest GCC
        run: |
          latest_gcc=$(find /usr/local -maxdepth 1 -type d -name 'gcc-*' | sort -V | tail -n1)
          echo "LATEST_GCC=$latest_gcc" >> "$GITHUB_ENV"

      - name: Save GCC Cache
        run: |
          sudo cp -r "$LATEST_GCC"/* ./cache/gcc-latest

      - name: Give Read Access For Apt Folder
        run: sudo chown -R $USER:$USER ./cache/apt-packages/apt/archives/lock ./cache/apt-packages/apt/archives/partial ./cache/apt-lists/lists/lock ./cache/apt-lists/lists/partial
