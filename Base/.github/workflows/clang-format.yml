name: Clang format

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      [
        '**.c',
        '**.cpp',
        '**.h',
        '**.hpp',
        '**.cxx',
        '**.hxx',
        '**.cc',
        '**.hh',
        'Makefile',
        '**CMakeLists.txt',
        'meson.build',
        '**.cmake',
        '**CMakePresets.json',
        '.github/workflows/clang-format.yml',
        'vcpkg.json',
      ]
  push:
    branches: [main, master, develop]
    paths:
      [
        '**.c',
        '**.cpp',
        '**.h',
        '**.hpp',
        '**.cxx',
        '**.hxx',
        '**.cc',
        '**.hh',
        'Makefile',
        '**CMakeLists.txt',
        'meson.build',
        '**.cmake',
        '**CMakePresets.json',
        '.github/workflows/clang-format.yml',
        'vcpkg.json',
      ]

jobs:
  clang-format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.temp }}/vcpkg'

      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=${{ runner.temp }}/vcpkg" >> "$GITHUB_ENV"

      - name: Set up Cache Site
        run: mkdir -p ./cache

      - name: Set up Apt Cache Site
        run: |
          mkdir -p ./cache/apt-packages
          mkdir -p ./cache/apt-lists

      - name: Set up GCC Cache Site
        run: |
          mkdir -p ./cache/gcc-latest

      - name: Cache Apt Packages
        id: cache-apt-packages
        uses: actions/cache@v5
        with:
          path: ./cache/apt-packages
          key: ${{ runner.os }}-apt-packages-${{ hashFiles('makefileDependencies.sh') }}
          restore-keys: |
            ${{ runner.os }}-apt-packages-

      - name: Cache Apt Package Lists
        id: cache-apt-lists
        uses: actions/cache@v5
        with:
          path: ./cache/apt-lists
          key: ${{ runner.os }}-apt-lists-${{ hashFiles('makefileDependencies.sh') }}
          restore-keys: |
            ${{ runner.os }}-apt-lists-

      - name: Cache GCC
        id: cache-gcc-latest
        uses: actions/cache@v5
        with:
          path: |
            ./cache/gcc-latest
          key: ${{ runner.os }}-gcc-latest-${{ hashFiles('makefileDependencies.sh') }}
          restore-keys: |
            ${{ runner.os }}-gcc-latest-

      - name: Install Apt Packages From Cache
        if: steps.cache-apt-packages.outputs.cache-hit == 'true'
        run: sudo cp -r ./cache/apt-packages/apt/* /var/cache/apt

      - name: Install Apt Lists From Cache
        if: steps.cache-apt-lists.outputs.cache-hit == 'true'
        run: sudo cp -r ./cache/apt-lists/lists/* /var/lib/apt/lists

      - name: Install GCC From Cache
        if: steps.cache-gcc-latest.outputs.cache-hit == 'true'
        run: |
          sudo mkdir -p /usr/local/gcc-latest
          sudo cp -r ./cache/gcc-latest/* /usr/local/gcc-latest/
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/local/gcc-latest/bin/g++ 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/local/gcc-latest/bin/gcc 100
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/local/gcc-latest/bin/gcov 100

      - name: Install dependencies
        if: steps.cache-apt-packages.outputs.cache-hit != 'true' || steps.cache-apt-lists.outputs.cache-hit != 'true' || steps.cache-gcc-latest.outputs.cache-hit != 'true'
        run: sudo bash $GITHUB_WORKSPACE/makefileDependencies.sh a

      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: 'file' # Use .clang-format config file.
          tidy-checks: '-*' # Disable clang-tidy entirely.
          version: '23' # Use the latest support llvm toolchain version
          thread-comments: ${{ github.event_name == 'pull_request' && 'update' }} # only 'update' a single comment in a pull request's thread.
          step-summary: 'true' # append content as part of the workflow's job summary
          format-review: 'true' # Enables pull request reviews from clang-format
          lines-changed-only: 'true' # Only lines in the diff that contain additions are analyzed

      - name: Save Apt Packages Cache
        run: |
          sudo cp -r /var/cache/apt ./cache/apt-packages

      - name: Save Apt Lists Cache
        run: |
          sudo cp -r /var/lib/apt/lists ./cache/apt-lists

      - name: Find latest GCC
        run: |
          latest_gcc=$(find /usr/local -maxdepth 1 -type d -name 'gcc-*' | sort -V | tail -n1)
          echo "LATEST_GCC=$latest_gcc" >> "$GITHUB_ENV"

      - name: Save GCC Cache
        run: |
          sudo cp -r "$LATEST_GCC"/* ./cache/gcc-latest

      - name: Give Read Access For Apt Folder
        run: sudo chown -R $USER:$USER ./cache/apt-packages/apt/archives/lock ./cache/apt-packages/apt/archives/partial ./cache/apt-lists/lists/lock ./cache/apt-lists/lists/partial

      - name: Fail fast?!
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1
