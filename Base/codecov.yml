coverage:
  precision: 2
  round: down
  range: '70...100'

  status:
    project:
      default:
        target: 80% # overall project coverage must stay >= 80%
        threshold: 1% # allow up to 1% drop without failing
        base: auto
        if_ci_failed: error
    patch:
      default:
        target: 70% # new/changed lines in the PR must be >= 70%
        threshold: 0% # allow no drop without failing
        base: auto
        if_ci_failed: error

  ignore:
    - "tests/**" # ignore all files in the tests directory (recursive)
    - "testInclude/**" # ignore all files in the testInclude directory (recursive)
    - "benchmarks/**" # ignore all files in the benchmarks directory (recursive)
    - "src/tracy/**" # ignore all files in the src/tracy directory (recursive)

comment:
  layout: 'reach,diff,flags,tree,footer'
  behavior: default # Updated the existing comment instead of adding new ones
  require_changes: false
  require_base: false
  require_head: true

# Only post status to PRs / branch pushes, not to every CI job
github_checks:
  annotations: true
